<!doctype html>
<html lang="en"{% if page.theme == 'sage' %} data-sage-theme{% endif %}>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ site.data.main_info.name | escape }} | {{ page.title | escape }}</title>
  <meta name="description" content="Atharv Chagi’s research in language models and experience in software engineering.">
  <meta name="author" content="{{ site.data.main_info.name | escape }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,400;0,500;0,700;1,400&amp;display=swap">
  {% if page.path == 'index.html' %}
  <link rel="stylesheet" href="{{ '/libs/external/fontawesome-free-6.6.0-web/css/all.min.css' | relative_url }}">
  <link rel="stylesheet" href="{{ '/libs/external/academicons-1.8.6/css/academicons.min.css' | relative_url }}">
  {% endif %}
  <link rel="stylesheet" href="{{ '/libs/custom/my_css.css' | relative_url }}">
</head>
<body{% if page.url == '/more/' %} class="sage-fade"{% endif %}>
  <a class="skip-link" href="#main">Skip to content</a>

  <header class="site-header shell">
    <nav class="site-nav" aria-label="Main">
      <a href="{{ '/' | relative_url }}#bio">About</a>
      <a href="{{ '/' | relative_url }}#publications">Research</a>
      <a href="{{ '/' | relative_url }}#resume">Experience</a>
      <a href="{{ '/more/' | relative_url }}"{% if page.url == '/more/' %} aria-current="page"{% endif %}>More</a>
    </nav>
  </header>

  <main class="shell" id="main" tabindex="-1">
    {{ content }}
  </main>

  <footer class="site-footer shell" id="contact">
    <a class="wordmark" href="{{ '/' | relative_url }}">{{ site.data.main_info.name }}</a>
    <span>{{ site.data.main_info.email }}</span>
  </footer>

  {% include google_analytics.html %}
  <span id="62cd7b7da1aff3196fdc26b60e396df9"></span>
</body>
</html>
