---
layout: default
title: Blog
permalink: /more/blog/
theme: sage
---

<header class="intro">
  <h1 id="blog-heading">Blog</h1>
</header>

<section class="site-section" aria-labelledby="blog-heading">
  {% if site.posts.size > 0 %}
  <ul class="blog-list">
    {% for post in site.posts %}
    <li class="blog-entry">
      <time class="blog-date" datetime="{{ post.date | date: '%Y-%m-%d' }}">{{ post.date | date: '%b %d, %Y' }}</time>
      <a href="{{ post.url | relative_url }}">{{ post.title | escape }}</a>
    </li>
    {% endfor %}
  </ul>
  {% else %}
  <p class="entry-meta">No posts yet.</p>
  {% endif %}
</section>
